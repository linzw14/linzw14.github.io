<section class="page-intro wrap"><div class="eyebrow" data-en="Research" data-zh="研究方向"></div><h1 data-en="Interfaces for living intelligence" data-zh="连接生命智能的界面"></h1><p data-en="We ask how molecular states become neural dynamics, how neural dynamics guide behavior, and how intelligent machines can sense, model, and respond to both. Our answer is a new class of closed-loop interfaces built across scales." data-zh="我们探索分子状态如何形成神经动力学、神经动力学如何引导行为，以及智能机器如何感知、建模并响应二者。我们的路径，是构建跨越多尺度的新一代闭环智能接口。"></p><div class="methods"><span>Flexible bioelectronics</span><span>Spatial multi-omics</span><span>Brain–computer interfaces</span><span>AI agents</span><span>Lab automation</span><span>Embodied systems</span></div></section>
<section class="section wrap"><article class="pillar"><div class="pillar-index">01</div><h2 data-en="Flexible bioelectronics &amp; long-term BCI" data-zh="柔性生物电子与长期脑机接口"></h2><p data-en="We create tissue-like interfaces that record and modulate neural activity with high spatial resolution and long-term stability. By treating mechanics, biology, and computation as one design problem, we aim to build BCIs that can learn alongside the brain." data-zh="我们研发具备组织相似力学性质的界面，实现高空间分辨率、长期稳定的神经记录与调控。通过将力学、生物学和计算视作同一设计问题，构建能够与大脑共同学习的脑机接口。"></p></article>
<article class="pillar"><div class="pillar-index">02</div><h2 data-en="Functional–molecular mapping &amp; virtual cells" data-zh="功能—分子图谱与虚拟细胞"></h2><p data-en="Electrical activity tells us what a cell is doing; spatial omics reveals why. We integrate both to build multimodal maps—and computational virtual-cell models—that connect gene programs, cell states, tissue organization, and function." data-zh="电活动告诉我们细胞正在做什么，空间组学则解释为什么。我们整合二者，构建连接基因程序、细胞状态、组织结构与功能的多模态图谱和虚拟细胞模型。"></p></article>
<article class="pillar"><div class="pillar-index">03</div><h2 data-en="AI agents for biology" data-zh="面向生命科学的 AI 智能体"></h2><p data-en="Biological experiments generate heterogeneous images, signals, sequences, and protocols. We develop multimodal agents that reason across them—designing devices, analyzing neural data, interpreting cell states, and making scientific workflows more reproducible." data-zh="生命科学实验产生图像、信号、序列和流程等异构信息。我们开发能够跨模态推理的智能体，用于器件设计、神经数据分析、细胞状态解析，并提升科研流程的可重复性。"></p></article>
<article class="pillar"><div class="pillar-index">04</div><h2 data-en="Embodied, closed-loop experimentation" data-zh="具身化闭环实验系统"></h2><p data-en="Intelligence becomes useful when it can act. We connect models to automated fabrication, visual inspection, robotic experimentation, and adaptive intervention—forming human–AI–biology loops that improve through experience." data-zh="智能只有能够行动才真正产生价值。我们将模型连接到自动化制造、视觉质检、机器人实验和自适应干预，构建通过经验持续改进的人—AI—生命系统闭环。"></p></article></section>
<section class="section dark"><div class="wrap"><div class="section-head"><div><span class="eyebrow" data-en="Our north star" data-zh="长期目标"></span><h2 data-en="A BCI that understands context—not only spikes." data-zh="让脑机接口理解情境，<br>而不只是脉冲。"></h2></div><p data-en="The next generation of neural interfaces should understand the molecular condition of tissue, the evolving state of neural circuits, human intent, and the consequences of machine action. That is the multiscale intelligence we are building toward." data-zh="下一代神经接口应同时理解组织的分子状态、神经回路的动态变化、人的意图以及机器行动的后果。这正是我们希望构建的多尺度智能。"></p></div></div></section>
