<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>People · The Lin Lab</title><meta name="description" content="Meet Zuwan Lin and the founding team of the Intelligent Brain–Computer Interfaces and Bioelectronics Laboratory at Westlake University."><meta property="og:title" content="People · The Lin Lab"><meta property="og:description" content="A new interdisciplinary laboratory, built together at Westlake University."><meta property="og:image" content="https://linzw14.github.io/og-v3.png"><meta name="twitter:card" content="summary_large_image"><link rel="stylesheet" href="site-v2.css"><script defer src="site-v2.js"></script></head><body><header class="site-header" data-site-header></header><main><section class="page-intro wrap"><div class="eyebrow" data-en="People" data-zh="团队"></div><h1 data-en="A new lab, built together" data-zh="一个共同建立的新实验室"></h1><p data-en="We are assembling an interdisciplinary founding team at Westlake University. Different technical languages are welcome; curiosity, rigor, and generosity are shared requirements." data-zh="我们正在西湖大学组建跨学科创始团队。不同的技术语言都受到欢迎；好奇心、严谨与开放合作是我们共同的要求。"></p></section><section class="section wrap"><div class="person"><img src="profile-photo.jpg" alt="Zuwan Lin"><div><div class="eyebrow" data-en="Principal Investigator" data-zh="实验室负责人"></div><h2 data-en="Zuwan Lin" data-zh="林祖万"></h2><div class="role" data-en="Assistant Professor · School of Engineering" data-zh="西湖大学工学院 · 助理教授"></div><p data-en="Zuwan Lin works at the interface of flexible bioelectronics, brain–computer interfaces, multimodal spatial omics, artificial intelligence, and lab automation. He received his B.S. from Tsinghua University in 2018 and Ph.D. from Harvard University in 2024, followed by postdoctoral research at Harvard SEAS. He joins Westlake University in 2027 as Principal Investigator of the Intelligent Brain–Computer Interfaces and Bioelectronics Laboratory." data-zh="林祖万的研究位于柔性生物电子、脑机接口、多模态空间组学、人工智能与实验室自动化的交叉地带。他于2018年获清华大学学士学位，2024年获哈佛大学博士学位，随后在哈佛大学工程与应用科学学院开展博士后研究。2027年加入西湖大学，组建智能脑机接口与生物电子实验室。"></p><div class="button-row"><a class="button secondary" href="https://www.westlake.edu.cn/faculty/zuwan-lin.html" target="_blank" data-en="Faculty profile · 中文" data-zh="西湖大学教师主页"></a><a class="button secondary" href="https://en.westlake.edu.cn/faculty/zuwan-lin.html" target="_blank" data-en="Faculty profile · English" data-zh="英文教师主页"></a><a class="button secondary" href="https://scholar.google.com/citations?user=huZAOOQAAAAJ&amp;hl=en" target="_blank">Google Scholar</a></div><div class="timeline"><div><b>2027—</b><span data-en="Assistant Professor, Westlake University" data-zh="西湖大学助理教授、独立实验室负责人"></span></div><div><b>2024—27</b><span data-en="Postdoctoral Researcher, Harvard SEAS" data-zh="哈佛大学工程与应用科学学院博士后"></span></div><div><b>2024</b><span data-en="Ph.D., Harvard University" data-zh="哈佛大学博士"></span></div><div><b>2018</b><span data-en="B.S., Tsinghua University" data-zh="清华大学学士"></span></div></div></div></div></section><section class="section wrap"><div class="recruit-card"><span class="eyebrow" data-en="Founding team" data-zh="创始团队"></span><h2 data-en="Your name could be here." data-zh="下一个名字，可能就是你。"></h2><p data-en="Openings are available for postdoctoral fellows, research assistants, Ph.D. students, and visiting students across electronics, neuroscience, AI, robotics, and quantitative biology." data-zh="现招募博士后、科研助理、博士生和访问学生，方向涵盖电子工程、神经科学、人工智能、机器人与定量生物学。"></p><a class="button" href="join.html" data-en="How to apply" data-zh="申请方式"></a></div></section></main><footer class="site-footer" data-site-footer></footer></body></html>
