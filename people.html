        <h1 data-en="A new lab, built together" data-zh="一个共同建立的新实验室"></h1>
        <p class="lede" data-en="We are assembling an interdisciplinary founding team at Westlake University. Different technical languages are welcome; curiosity, rigor, and generosity are shared requirements." data-zh="我们正在西湖大学组建跨学科创始团队。不同的技术语言都受到欢迎；好奇心、严谨与开放合作是我们共同的要求。"></p>
      </div>
    </section>

    <section class="section" style="padding-top:20px">
      <div class="wrap">
        <div class="person">
          <div class="photo"><img src="zuwan-lin-photo.jpg" alt="Zuwan Lin"></div>
          <div>
            <div class="eyebrow" data-en="Principal Investigator" data-zh="实验室负责人"></div>
            <h2 data-en="Zuwan Lin" data-zh="林祖万"></h2>
            <div class="role" data-en="Assistant Professor · School of Engineering, Westlake University" data-zh="西湖大学工学院 · 助理教授"></div>
            <p data-en="Zuwan Lin works at the interface of flexible bioelectronics, brain–computer interfaces, multimodal spatial omics, artificial intelligence, and lab automation. He received his B.S. from Tsinghua University in 2018 and Ph.D. from Harvard University in 2024, followed by postdoctoral research at Harvard SEAS. He joins Westlake University in 2027 as Principal Investigator of the Intelligent Brain–Computer Interfaces and Bioelectronics Laboratory." data-zh="林祖万的研究位于柔性生物电子、脑机接口、多模态空间组学、人工智能与实验室自动化的交叉地带。他于2018年获清华大学学士学位，2024年获哈佛大学博士学位，随后在哈佛大学工程与应用科学学院开展博士后研究。2027年加入西湖大学，组建智能脑机接口与生物电子实验室。"></p>
            <p data-en="His work has appeared in Cell, Nature, Science, Nature Neuroscience, Nature Methods, Science Advances, and Nature Protocols, including cover articles in Cell and Nature." data-zh="他的研究成果发表于 Cell、Nature、Science、Nature Neuroscience、Nature Methods、Science Advances 与 Nature Protocols 等期刊，包括 Cell 与 Nature 封面论文。"></p>
            <div class="button-row" style="margin-top:18px">
              <a class="button secondary" href="https://scholar.google.com/citations?user=huZAOOQAAAAJ&amp;hl=en" target="_blank" rel="noopener">Google Scholar</a>
              <a class="button secondary" href="https://github.com/linzw14" target="_blank" rel="noopener">GitHub</a>
              <a class="button secondary" href="https://www.linkedin.com/in/zuwan-lin-545b1b214/" target="_blank" rel="noopener">LinkedIn</a>
              <a class="button secondary" href="https://www.westlake.edu.cn/faculty/zuwan-lin.html" target="_blank" rel="noopener" data-en="Faculty profile · 中文" data-zh="西湖大学教师主页"></a>
              <a class="button secondary" href="https://en.westlake.edu.cn/faculty/zuwan-lin.html" target="_blank" rel="noopener" data-en="Faculty profile · English" data-zh="英文教师主页"></a>
            </div>
            <div class="timeline">
              <div><b>2027—</b><span data-en="Assistant Professor, Westlake University" data-zh="西湖大学助理教授、独立实验室负责人"></span></div>
              <div><b>2024—27</b><span data-en="Postdoctoral Researcher, Harvard SEAS" data-zh="哈佛大学工程与应用科学学院博士后"></span></div>
              <div><b>2024</b><span data-en="Ph.D., Harvard University" data-zh="哈佛大学博士"></span></div>

    <section class="section" style="padding-top:0">
      <div class="wrap">
        <div class="values">
          <div class="value">
            <h3 data-en="Curiosity" data-zh="好奇心"></h3>
            <p data-en="The best projects here start with a biological question someone could not stop thinking about." data-zh="最好的课题，往往始于一个让人念念不忘的生命科学问题。"></p>
          </div>
          <div class="value">
            <h3 data-en="Rigor" data-zh="严谨"></h3>
            <p data-en="Multimodal claims demand careful controls. We hold our tools and our conclusions to the same standard." data-zh="多模态的结论需要严格的对照。我们以同样的标准要求工具与结论。"></p>
          </div>
          <div class="value">
            <h3 data-en="Generosity" data-zh="开放合作"></h3>
            <p data-en="Everyone teaches their own field and learns another. Credit is shared; so is the fun." data-zh="每个人都乐于分享自己的领域，也深入学习另一个领域。成果共享，乐趣亦然。"></p>
          </div>
        </div>
      </div>
    </section>
