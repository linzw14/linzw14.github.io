          <p data-en="A platform that combines flexible bioelectronics with spatial transcriptomics, linking what cells are with what they do—within the same living system." data-zh="该平台将柔性生物电子与空间转录组学相结合，在同一个生命系统中连接“细胞是什么”与“细胞在做什么”。"></p>

        </div>
      </div>

          <p data-en="DeviceAgent links design, protocol generation, visual inspection, troubleshooting, and multimodal analysis." data-zh="DeviceAgent 连接器件设计、流程生成、视觉质检、故障诊断与多模态分析。"></p>
          <div class="story-venue">bioRxiv · 2025</div>
        </article>
