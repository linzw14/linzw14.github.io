<section class="section wrap"><div class="section-head"><div><span class="eyebrow" data-en="One closed loop" data-zh="一个闭环"></span><h2 data-en="Three scales of intelligence" data-zh="三种尺度的智能"></h2></div><p data-en="Biology does not separate sensing, computation, and action. Neither do we. Our lab integrates bioelectronics, spatial biology, AI agents, and robotics into systems that learn with living tissues." data-zh="生物系统从不割裂感知、计算与行动。我们也一样：实验室将生物电子、空间生物学、AI智能体与机器人融合为能够与生命组织共同学习的系统。"></p></div><div class="framework"><article><span class="number">01</span><h3 data-en="Molecular intelligence" data-zh="分子智能"></h3><p data-en="Virtual cells, spatial multi-omics, and organoid models reveal how molecular programs give rise to function." data-zh="通过虚拟细胞、空间多组学与类器官模型，理解分子程序如何涌现为生命功能。"></p></article><article><span class="number">02</span><h3 data-en="Neural intelligence" data-zh="神经智能"></h3><p data-en="Tissue-like electronics capture and modulate neural activity over the timescales on which brains learn and change." data-zh="组织级柔性电子在大脑学习与变化的时间尺度上，长期记录并调控神经活动。"></p></article><article><span class="number">03</span><h3 data-en="Embodied intelligence" data-zh="具身智能"></h3><p data-en="AI agents and physical systems translate biological understanding into adaptive, human-centered action." data-zh="AI智能体与物理系统将对生命的理解转化为自适应、以人为中心的行动。"></p></article></div><div class="flow"><span data-en="Sense" data-zh="感知"></span><i>→</i><span data-en="Model" data-zh="建模"></span><i>→</i><span data-en="Act" data-zh="行动"></span><i>→</i><span data-en="Adapt" data-zh="适应"></span><i>↻</i></div></section>
