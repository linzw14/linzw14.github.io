ntrol, and automation" data-zh="机器人、控制与自动化"></li><li data-en="Spatial omics and computational biology" data-zh="空间组学与计算生物学"></li></ul></article></div><div class="contact-box"><h2 data-en="How to apply" data-zh="申请方式"></h2><p data-en="Email Zuwan with a brief introduction, your CV, and a concise description of the question you most want to work on. Please use a subject line that includes the position you are applying for." data-zh="请发送邮件给林祖万，并附上简短自我介绍、个人简历，以及你最希望探索的科学问题。邮件主题请注明申请岗位。"></p><p><a href="mailto:linzuwan@westlake.edu.cn">linzuwan@westlake.edu.cn</a></p><p data-en="Intelligent Brain–Computer Interfaces and Bioelectronics Laboratory<br>School of Engineering, Westlake University<br>600 Dunyu Road, Hangzhou, Zhejiang 310030, China" data-zh="智能脑机接口与生物电子实验室<br>西湖大学工学院<br>浙江省杭州市西湖区墩余路600号，310030"></p></div></section></main><footer class="site-footer" data-site-footer></footer></body></html>
