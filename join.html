<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Join · The Lin Lab</title>
  <meta name="description" content="Join the founding team of the Lin Lab at Westlake University.">
  <meta property="og:title" content="Join · The Lin Lab">
  <meta property="og:description" content="Build across boundaries in bioelectronics, neuroscience, AI, robotics, and quantitative biology.">
  <meta property="og:image" content="https://linzw14.github.io/og-v4.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://linzw14.github.io/og-v4.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,600&family=Inter:wght@400;550;600;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-v3.css">
  <script defer src="site-v3.js"></script>
</head>
<body>
  <header class="site-header" data-site-header></header>
  <main>

    <section class="page-intro">
      <div class="wrap">
        <div class="eyebrow" data-en="Join us" data-zh="加入我们"></div>
        <h1 data-en="Build across boundaries" data-zh="跨越边界，创造未来"></h1>
        <p class="lede" data-en="Aligning molecular, neural, and embodied intelligence cannot be done inside one discipline. We are looking for people eager to learn another field deeply—and teach their own field generously." data-zh="对齐分子、人脑与具身智能，无法在单一学科内完成。我们寻找愿意深入学习另一领域、也乐于分享自身专长的伙伴。"></p>
      </div>
    </section>

    <section class="section" style="padding-top:20px">
      <div class="wrap">
        <div class="join-grid">
          <article class="join-card">
            <h2 data-en="Open positions" data-zh="招募岗位"></h2>
            <ul>
              <li data-en="Postdoctoral fellows" data-zh="博士后"></li>
              <li data-en="Ph.D. students" data-zh="博士研究生"></li>
              <li data-en="Research assistants" data-zh="科研助理"></li>
              <li data-en="Visiting students &amp; research interns" data-zh="访问学生与科研实习生"></li>
            </ul>
          </article>
          <article class="join-card jc2">
            <h2 data-en="Backgrounds we value" data-zh="我们重视的背景"></h2>
            <ul>
              <li data-en="Flexible electronics, microfabrication, materials" data-zh="柔性电子、微纳加工与材料"></li>
              <li data-en="Neuroscience, electrophysiology, BCI" data-zh="神经科学、电生理与脑机接口"></li>
              <li data-en="Machine learning, AI agents, VLA &amp; world models" data-zh="机器学习、AI 智能体、VLA 与世界模型"></li>
              <li data-en="Robotics, control, and automation" data-zh="机器人、控制与自动化"></li>
              <li data-en="Spatial omics and computational biology" data-zh="空间组学与计算生物学"></li>
            </ul>
          </article>
        </div>

        <div class="values" style="margin-bottom:22px">
          <div class="value">
            <h3 data-en="Real problems, whole loops" data-zh="真实问题，完整闭环"></h3>
            <p data-en="Projects span device to data to deployment—you will see your work sense, decide, and act." data-zh="课题贯穿器件、数据与部署——你将看到自己的工作真正感知、决策并行动。"></p>
          </div>
          <div class="value">
            <h3 data-en="Founding-member ownership" data-zh="创始成员的主人翁角色"></h3>
            <p data-en="Early members shape the lab's directions, culture, and infrastructure from day one." data-zh="早期成员从第一天起，就参与塑造实验室的方向、文化与基础设施。"></p>
          </div>
          <div class="value">
            <h3 data-en="A network, not just a lab" data-zh="不止一个实验室"></h3>
            <p data-en="Collaborations across leading universities and industry partners in AI, robotics, and biotech." data-zh="与顶尖高校及 AI、机器人、生物科技产业伙伴保持深度合作。"></p>
          </div>
        </div>

        <div class="contact-box">
          <h2 data-en="How to apply" data-zh="申请方式"></h2>
          <p data-en="Email Zuwan with a brief introduction, your CV, and a concise description of the question you most want to work on. Please use a subject line that includes the position you are applying for." data-zh="请发送邮件给林祖万，并附上简短自我介绍、个人简历，以及你最希望探索的科学问题。邮件主题请注明申请岗位。"></p>
          <p><a href="mailto:linzuwan@westlake.edu.cn">linzuwan@westlake.edu.cn</a></p>
          <p data-en="Intelligent Brain–Computer Interfaces and Bioelectronics Laboratory<br>School of Engineering, Westlake University<br>600 Dunyu Road, Hangzhou, Zhejiang 310030, China" data-zh="智能脑机接口与生物电子实验室<br>西湖大学工学院<br>浙江省杭州市西湖区墩余路600号，310030"></p>
        </div>
      </div>
    </section>

  </main>
  <footer class="site-footer" data-site-footer></footer>
</body>
</html>
